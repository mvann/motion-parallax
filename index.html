<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Motion Parallax Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1116;
      --panel: #161a21;
      --text: #e6e8eb;
      --muted: #8b94a3;
      --cam: #4cb3ff;
      --bal: #ff5a4a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
    }
    .view {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    #pov { flex: 3 1 0; min-height: 0; }
    #pov canvas { display: block; width: 100% !important; height: 100% !important; }
    #zoom { flex: 3 1 0; min-height: 0; border-top: 1px solid #222831; }
    #zoom canvas { display: block; width: 100% !important; height: 100% !important; }
    #map-wrap {
      flex: 2 1 0; min-height: 0;
      background: #1b212b;
      border-top: 1px solid #222831;
    }
    #map { width: 100%; height: 100%; display: block; }
    .label {
      position: absolute;
      top: 8px; left: 10px;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
      font-weight: 600;
    }
    .controls {
      flex: 0 0 auto;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom)) 14px;
      background: var(--panel);
      border-top: 1px solid #222831;
    }
    .ctrl-row { margin-bottom: 6px; }
    .ctrl-row:last-child { margin-bottom: 0; }
    .ctrl-head {
      display: flex;
      gap: 8px;
      align-items: baseline;
      font-size: 13px;
      color: var(--muted);
    }
    .ctrl-head .val {
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      margin-left: auto;
    }
    .ctrl-head select {
      background: #0e1116;
      color: var(--text);
      border: 1px solid #2c333d;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
      font-family: inherit;
      max-width: 50%;
    }
    .ctrl-head select:focus { outline: 1px solid var(--cam); }
    .vspeed {
      color: var(--cam);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .vspeed.hidden { display: none; }
    .dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; margin-right: 6px; vertical-align: middle;
    }
    input[type="range"] {
      width: 100%;
      height: 28px;
      margin: 0;
      background: transparent;
      display: block;
    }
    input#camSlider { accent-color: var(--cam); }
    input#balSlider { accent-color: var(--bal); }
  </style>
</head>
<body>
  <div id="pov" class="view">
    <div class="label">Camera POV</div>
  </div>
  <div id="zoom" class="view">
    <div class="label">Zoomed</div>
  </div>
  <div id="map-wrap" class="view">
    <div class="label">Top-down</div>
    <canvas id="map"></canvas>
  </div>
  <div class="controls">
    <div class="ctrl-row">
      <div class="ctrl-head">
        <label for="camSlider"><span class="dot" style="background:var(--cam)"></span>Observer Position</label>
        <select id="vehicle" aria-label="Aircraft">
          <option value="f18">F-18 Super Hornet</option>
          <option value="fighter">Fighter jet</option>
          <option value="commercial">Commercial jet</option>
          <option value="helicopter">Helicopter</option>
          <option value="uav">UAV</option>
          <option value="biplane">Biplane</option>
          <option value="manual">Manual</option>
        </select>
        <span class="vspeed" id="vehicleSpeed">1,200 mph</span>
        <span class="val" id="camVal">−10,000 ft</span>
      </div>
      <input id="camSlider" type="range" min="-10000" max="10000" step="1" value="-10000">
    </div>
    <div class="ctrl-row">
      <div class="ctrl-head">
        <label for="balSlider"><span class="dot" style="background:var(--bal)"></span>Balloon height</label>
        <span class="val" id="balVal">13,000 ft</span>
      </div>
      <input id="balSlider" type="range" min="500" max="13000" step="50" value="13000">
    </div>
    <div class="ctrl-row">
      <div class="ctrl-head">
        <label for="distSlider"><span class="dot" style="background:var(--bal)"></span>Balloon distance</label>
        <span class="val" id="distVal">10,000 ft</span>
      </div>
      <input id="distSlider" type="range" min="500" max="25000" step="50" value="10000">
    </div>
    <div class="ctrl-row">
      <div class="ctrl-head">
        <label for="zoomSlider"><span class="dot" style="background:var(--cam)"></span>Zoom</label>
        <span class="val" id="zoomVal">500×</span>
      </div>
      <input id="zoomSlider" type="range" min="1" max="1000" step="1" value="500">
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // ---- Vehicles (cruise speeds in mph) ----
    const VEHICLES = {
      f18:        { name: 'F-18 Super Hornet', mph: 1200 },
      fighter:    { name: 'Fighter jet',       mph: 800  },
      commercial: { name: 'Commercial jet',    mph: 575  },
      helicopter: { name: 'Helicopter',        mph: 175  },
      uav:        { name: 'UAV',               mph: 135  },
      biplane:    { name: 'Biplane',           mph: 100  },
      manual:     { name: 'Manual',            mph: 0    },
    };
    let currentVehicle = 'f18';
    let flightDir = 1;          // +1 right, -1 left
    let lastFrameT = 0;

    // ---- World constants (feet) ----
    const CAMERA_Y = 25000;
    const CAMERA_PATH_HALF = 10000;
    const BALLOON_HEIGHT_MIN = 500;
    const BALLOON_HEIGHT_MAX = 13000;
    const BALLOON_HEIGHT_DEFAULT = 13000;
    const BALLOON_Z_MIN = 500;
    const BALLOON_Z_MAX = 25000;
    const BALLOON_Z_DEFAULT = 10000;
    const ZOOM_MIN = 1;
    const ZOOM_MAX = 1000;
    const ZOOM_DEFAULT = 500;
    const WIDE_FOV = 55;

    // ---- POV (Three.js) ----
    const povEl = document.getElementById('pov');
    const zoomEl = document.getElementById('zoom');
    let renderer = null, zoomRenderer = null;
    function makeRenderer(host) {
      try {
        const r = new THREE.WebGLRenderer({ antialias: true });
        r.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        host.appendChild(r.domElement);
        return r;
      } catch (e) {
        const msg = document.createElement('div');
        msg.textContent = 'WebGL not available on this device.';
        msg.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b94a3;font-size:13px;text-align:center;padding:20px';
        host.appendChild(msg);
        return null;
      }
    }
    renderer = makeRenderer(povEl);
    zoomRenderer = makeRenderer(zoomEl);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ec9f3);
    scene.fog = new THREE.Fog(0xb8d4f0, 25000, 90000);

    const camera = new THREE.PerspectiveCamera(55, 1, 10, 250000);
    const zoomCamera = new THREE.PerspectiveCamera(5, 1, 10, 250000);

    // Lights
    const sun = new THREE.DirectionalLight(0xfff1d6, 1.0);
    sun.position.set(-20000, 30000, -8000);
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x4a3a2a, 0.55));

    // Procedural ocean texture
    function makeOceanTexture() {
      const size = 512;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      g.fillStyle = '#1c4a74';
      g.fillRect(0, 0, size, size);
      // Wavy lighter patches
      for (let i = 0; i < 1800; i++) {
        const x = Math.random() * size, y = Math.random() * size;
        const r = 4 + Math.random() * 18;
        const sh = 30 + (Math.random() * 40) | 0;
        g.fillStyle = `rgba(${70 + sh},${120 + sh},${165 + sh},${0.10 + Math.random() * 0.22})`;
        g.beginPath();
        g.arc(x, y, r, 0, Math.PI * 2);
        g.fill();
      }
      // Whitecaps
      for (let i = 0; i < 700; i++) {
        g.fillStyle = `rgba(255,255,255,${0.35 + Math.random() * 0.55})`;
        g.beginPath();
        g.arc(Math.random() * size, Math.random() * size, 0.4 + Math.random() * 1.4, 0, Math.PI * 2);
        g.fill();
      }
      // Horizontal ripple streaks (give a sense of swell direction)
      for (let i = 0; i < 220; i++) {
        g.strokeStyle = `rgba(190,215,235,${0.08 + Math.random() * 0.15})`;
        g.lineWidth = 0.5;
        const y = Math.random() * size;
        g.beginPath();
        g.moveTo(Math.random() * size, y);
        g.lineTo(Math.random() * size + 30 + Math.random() * 60, y + (Math.random() - 0.5) * 2);
        g.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 4;
      return tex;
    }

    // Ocean
    {
      const g = new THREE.PlaneGeometry(400000, 400000, 1, 1);
      g.rotateX(-Math.PI / 2);
      const tex = makeOceanTexture();
      tex.repeat.set(70, 70);  // tile ~5,700 ft per repeat
      const m = new THREE.MeshLambertMaterial({ map: tex, color: 0x9cb8d8 });
      scene.add(new THREE.Mesh(g, m));
    }

    // Balloon — a ~3 ft latex party balloon (ellipsoidal with a small knot)
    const balloonGroup = new THREE.Group();
    {
      // Profile in feet, right half (revolved around Y). Max diameter ~3 ft.
      const profile = [
        new THREE.Vector2(0.00, 0.00), // knot bottom tip
        new THREE.Vector2(0.08, 0.05),
        new THREE.Vector2(0.10, 0.14), // small knot bulge
        new THREE.Vector2(0.06, 0.18), // pinch above knot
        new THREE.Vector2(0.18, 0.28),
        new THREE.Vector2(0.45, 0.55),
        new THREE.Vector2(0.85, 0.95),
        new THREE.Vector2(1.20, 1.40),
        new THREE.Vector2(1.42, 1.90),
        new THREE.Vector2(1.50, 2.20), // widest, ~2/3 of total height
        new THREE.Vector2(1.45, 2.55),
        new THREE.Vector2(1.28, 2.90),
        new THREE.Vector2(0.95, 3.20),
        new THREE.Vector2(0.45, 3.45),
        new THREE.Vector2(0.00, 3.55), // top
      ];
      // Center vertically so group origin sits at the balloon's middle
      const yCenter = 3.55 / 2;
      const pts = profile.map(p => new THREE.Vector2(p.x, p.y - yCenter));
      const geom = new THREE.LatheGeometry(pts, 36);
      const mat = new THREE.MeshPhongMaterial({
        color: 0xe23a2c, shininess: 90, specular: 0x999999,
      });
      balloonGroup.add(new THREE.Mesh(geom, mat));
    }
    scene.add(balloonGroup);

    function resizeRenderer(r, host, cam) {
      if (!r) return;
      const w = host.clientWidth, h = host.clientHeight;
      if (w === 0 || h === 0) return;
      r.setSize(w, h, false);
      cam.aspect = w / h;
      cam.updateProjectionMatrix();
    }
    function resizePov()  { resizeRenderer(renderer,     povEl,  camera); }
    function resizeZoom() { resizeRenderer(zoomRenderer, zoomEl, zoomCamera); }
    new ResizeObserver(resizePov).observe(povEl);
    new ResizeObserver(resizeZoom).observe(zoomEl);

    // ---- Top-down (2D canvas) ----
    const mapCanvas = document.getElementById('map');
    const mctx = mapCanvas.getContext('2d');
    let mapDims = { W: 0, H: 0 };

    function resizeMap() {
      const dpr = Math.min(window.devicePixelRatio, 2);
      const w = mapCanvas.clientWidth, h = mapCanvas.clientHeight;
      mapCanvas.width = Math.floor(w * dpr);
      mapCanvas.height = Math.floor(h * dpr);
      mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      mapDims = { W: w, H: h };
    }
    new ResizeObserver(() => { resizeMap(); update(); }).observe(mapCanvas);

    // ---- Controls ----
    const camSlider = document.getElementById('camSlider');
    const balSlider = document.getElementById('balSlider');
    const distSlider = document.getElementById('distSlider');
    const zoomSlider = document.getElementById('zoomSlider');
    const camVal = document.getElementById('camVal');
    const balVal = document.getElementById('balVal');
    const distVal = document.getElementById('distVal');
    const zoomVal = document.getElementById('zoomVal');

    function fmt(n) {
      const r = Math.round(n);
      const sign = r < 0 ? '−' : '';
      return sign + Math.abs(r).toLocaleString() + ' ft';
    }

    function drawMap(cx, bz) {
      const { W, H } = mapDims;
      if (W === 0 || H === 0) return;
      mctx.clearRect(0, 0, W, H);

      // World view extents — adapt z to current balloon distance
      const xMin = -16000, xMax = 16000;
      const zMin = -2500, zMax = Math.max(bz + 3000, 14000);
      const sx = W / (xMax - xMin);
      const sz = H / (zMax - zMin);
      const s = Math.min(sx, sz);
      const ox = (W - (xMax - xMin) * s) / 2 - xMin * s;
      const oz = (H - (zMax - zMin) * s) / 2 - zMin * s;
      const X = x => x * s + ox;
      const Z = z => z * s + oz;

      // Background (a calm dark blue to evoke water from above)
      mctx.fillStyle = '#172a3d';
      mctx.fillRect(0, 0, W, H);

      // Subtle ocean texture: scattered ripples
      mctx.fillStyle = 'rgba(160,200,225,0.05)';
      for (let i = 0; i < 60; i++) {
        const px = (i * 173) % W;
        const py = (i * 211) % H;
        mctx.fillRect(px, py, 8, 1);
      }

      // Observer path
      mctx.strokeStyle = '#4cb3ff';
      mctx.lineWidth = 2;
      mctx.setLineDash([6, 4]);
      mctx.beginPath();
      mctx.moveTo(X(-CAMERA_PATH_HALF), Z(0));
      mctx.lineTo(X( CAMERA_PATH_HALF), Z(0));
      mctx.stroke();
      mctx.setLineDash([]);

      // Sight line
      mctx.strokeStyle = 'rgba(255,255,255,0.5)';
      mctx.lineWidth = 1;
      mctx.beginPath();
      mctx.moveTo(X(cx), Z(0));
      mctx.lineTo(X(0), Z(bz));
      mctx.stroke();

      // Aircraft marker — drawn aligned with the path (facing flight direction)
      const cax = X(cx), caz = Z(0);
      mctx.save();
      mctx.translate(cax, caz);
      if (currentVehicle !== 'manual' && flightDir < 0) mctx.rotate(Math.PI);
      drawAircraft(mctx, currentVehicle);
      mctx.restore();

      // Balloon marker (height varies but not visible from above; distance does show)
      mctx.fillStyle = '#ff5a4a';
      mctx.strokeStyle = 'white';
      mctx.lineWidth = 1;
      mctx.beginPath();
      mctx.arc(X(0), Z(bz), 7, 0, Math.PI * 2);
      mctx.fill();
      mctx.stroke();
    }

    // Aircraft icons (top-down, drawn facing +x, ~30 ft tall on screen)
    function drawAircraft(ctx, type) {
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.fillStyle = '#4cb3ff';
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 1;
      switch (type) {
        case 'fighter': {
          ctx.beginPath();
          ctx.moveTo(15, 0);
          ctx.lineTo(4, -2.5);
          ctx.lineTo(-3, -11);
          ctx.lineTo(-10, -10);
          ctx.lineTo(-10, -2.5);
          ctx.lineTo(-13, -5);
          ctx.lineTo(-13, 5);
          ctx.lineTo(-10, 2.5);
          ctx.lineTo(-10, 10);
          ctx.lineTo(-3, 11);
          ctx.lineTo(4, 2.5);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          break;
        }
        case 'commercial': {
          // Fuselage
          ctx.beginPath();
          ctx.moveTo(17, 0);
          ctx.lineTo(13, -2.5);
          ctx.lineTo(-15, -2);
          ctx.lineTo(-17, 0);
          ctx.lineTo(-15, 2);
          ctx.lineTo(13, 2.5);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Main wings (swept)
          ctx.beginPath();
          ctx.moveTo(4, -2);
          ctx.lineTo(-2, -13);
          ctx.lineTo(-6, -13);
          ctx.lineTo(-4, -2);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(4, 2);
          ctx.lineTo(-2, 13);
          ctx.lineTo(-6, 13);
          ctx.lineTo(-4, 2);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Tail wings
          ctx.beginPath();
          ctx.moveTo(-12, -1.5);
          ctx.lineTo(-14, -6);
          ctx.lineTo(-16, -6);
          ctx.lineTo(-14, -1.5);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-12, 1.5);
          ctx.lineTo(-14, 6);
          ctx.lineTo(-16, 6);
          ctx.lineTo(-14, 1.5);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          break;
        }
        case 'helicopter': {
          // Tail boom
          ctx.beginPath();
          ctx.moveTo(-2, -1.2);
          ctx.lineTo(-14, -1);
          ctx.lineTo(-14, 1);
          ctx.lineTo(-2, 1.2);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Tail rotor
          ctx.beginPath();
          ctx.ellipse(-14, 0, 1.5, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          // Body
          ctx.beginPath();
          ctx.ellipse(2, 0, 8, 5, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
          // Main rotor disc
          ctx.strokeStyle = 'rgba(76,179,255,0.55)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(2, 0, 13, 0, Math.PI * 2);
          ctx.stroke();
          break;
        }
        case 'uav': {
          // Quadcopter arms
          ctx.strokeStyle = '#4cb3ff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-8, -8); ctx.lineTo(8, 8);
          ctx.moveTo(-8, 8); ctx.lineTo(8, -8);
          ctx.stroke();
          // Hub
          ctx.fillStyle = '#4cb3ff';
          ctx.beginPath();
          ctx.arc(0, 0, 3, 0, Math.PI * 2);
          ctx.fill();
          // Rotor discs
          ctx.fillStyle = 'rgba(76,179,255,0.25)';
          ctx.strokeStyle = 'rgba(180,220,255,0.8)';
          ctx.lineWidth = 1;
          for (const [px, py] of [[-9,-9],[9,9],[-9,9],[9,-9]]) {
            ctx.beginPath();
            ctx.arc(px, py, 4, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
          }
          break;
        }
        case 'biplane': {
          // Fuselage
          ctx.beginPath();
          ctx.moveTo(11, 0);
          ctx.lineTo(7, -1.5);
          ctx.lineTo(-10, -1.5);
          ctx.lineTo(-10, 1.5);
          ctx.lineTo(7, 1.5);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Upper wing
          ctx.fillRect(-3, -11, 6, 22);
          ctx.strokeRect(-3, -11, 6, 22);
          // Lower wing hint (offset thin line) — gives biplane feel
          ctx.strokeStyle = 'rgba(255,255,255,0.65)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-1, -11); ctx.lineTo(-1, 11);
          ctx.moveTo(1, -11);  ctx.lineTo(1, 11);
          ctx.stroke();
          // Tail
          ctx.fillStyle = '#4cb3ff';
          ctx.strokeStyle = 'white';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-9, -4); ctx.lineTo(-12, -4);
          ctx.lineTo(-12, 4); ctx.lineTo(-9, 4);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          break;
        }
        default: { // manual
          ctx.beginPath();
          ctx.moveTo(13, 0);
          ctx.lineTo(-8, -8);
          ctx.lineTo(-8,  8);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
        }
      }
    }

    function update() {
      const cx = parseFloat(camSlider.value);
      const bh = parseFloat(balSlider.value);    // balloon height (Y)
      const bz = parseFloat(distSlider.value);   // balloon distance from path (Z)
      const zoom = parseFloat(zoomSlider.value); // telephoto multiplier
      camera.position.set(cx, CAMERA_Y, 0);
      balloonGroup.position.set(0, bh, bz);
      camera.lookAt(0, bh, bz);

      // Zoomed camera: same pose, FOV = wide FOV / zoom
      zoomCamera.position.copy(camera.position);
      zoomCamera.quaternion.copy(camera.quaternion);
      zoomCamera.fov = WIDE_FOV / zoom;
      zoomCamera.updateProjectionMatrix();

      camVal.textContent = fmt(cx);
      balVal.textContent = fmt(bh);
      distVal.textContent = fmt(bz);
      zoomVal.textContent = zoom.toFixed(0) + '×';
      drawMap(cx, bz);
    }

    const vehicleSelect = document.getElementById('vehicle');
    const speedEl = document.getElementById('vehicleSpeed');
    function setVehicle(v) {
      if (!VEHICLES[v]) v = 'manual';
      currentVehicle = v;
      if (vehicleSelect.value !== v) vehicleSelect.value = v;
      if (v === 'manual') {
        speedEl.classList.add('hidden');
      } else {
        speedEl.textContent = VEHICLES[v].mph.toLocaleString() + ' mph';
        speedEl.classList.remove('hidden');
      }
      lastFrameT = 0; // restart dt accumulation
    }

    // Optional query-string initial values: ?cam=10000&bal=12000&dist=8000&zoom=20&vehicle=helicopter
    {
      const q = new URLSearchParams(location.search);
      const c = parseFloat(q.get('cam'));
      const b = parseFloat(q.get('bal'));
      const d = parseFloat(q.get('dist'));
      const z = parseFloat(q.get('zoom'));
      if (Number.isFinite(c)) {
        camSlider.value = Math.max(-CAMERA_PATH_HALF, Math.min(CAMERA_PATH_HALF, c));
        currentVehicle = 'manual';
      }
      if (Number.isFinite(b)) balSlider.value  = Math.max(BALLOON_HEIGHT_MIN, Math.min(BALLOON_HEIGHT_MAX, b));
      if (Number.isFinite(d)) distSlider.value = Math.max(BALLOON_Z_MIN,      Math.min(BALLOON_Z_MAX,      d));
      if (Number.isFinite(z)) zoomSlider.value = Math.max(ZOOM_MIN,           Math.min(ZOOM_MAX,           z));
      const qv = q.get('vehicle');
      if (qv && VEHICLES[qv]) currentVehicle = qv;
    }
    setVehicle(currentVehicle);

    camSlider.addEventListener('input', () => {
      // Touching the observer slider switches to manual.
      if (currentVehicle !== 'manual') setVehicle('manual');
      update();
    });
    balSlider.addEventListener('input', update);
    distSlider.addEventListener('input', update);
    zoomSlider.addEventListener('input', update);
    vehicleSelect.addEventListener('change', () => setVehicle(vehicleSelect.value));

    function tick(t) {
      // Animate observer position when a vehicle is flying.
      if (currentVehicle !== 'manual') {
        if (lastFrameT > 0) {
          const dt = Math.min(0.1, (t - lastFrameT) / 1000);
          const ftPerSec = VEHICLES[currentVehicle].mph * 5280 / 3600;
          let pos = parseFloat(camSlider.value) + flightDir * ftPerSec * dt;
          if (pos >= CAMERA_PATH_HALF) { pos = CAMERA_PATH_HALF; flightDir = -1; }
          else if (pos <= -CAMERA_PATH_HALF) { pos = -CAMERA_PATH_HALF; flightDir = 1; }
          camSlider.value = pos;
          update();
        }
        lastFrameT = t;
      }
      if (renderer)     renderer.render(scene, camera);
      if (zoomRenderer) zoomRenderer.render(scene, zoomCamera);
      requestAnimationFrame(tick);
    }

    resizePov();
    resizeZoom();
    resizeMap();
    update();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
