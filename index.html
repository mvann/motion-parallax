<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Motion Parallax Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1116;
      --panel: #161a21;
      --text: #e6e8eb;
      --muted: #8b94a3;
      --cam: #4cb3ff;
      --bal: #ff5a4a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
    }
    .view {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    #grid {
      flex: 5 1 0;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1px;
      background: #222831;
    }
    #grid .cell {
      position: relative;
      overflow: hidden;
      background: #000;
      min-width: 0;
      min-height: 0;
    }
    #grid .cell canvas { display: block; width: 100% !important; height: 100% !important; }
    #map-wrap {
      flex: 2 1 0; min-height: 0;
      background: #1b212b;
      border-top: 1px solid #222831;
    }
    #map { width: 100%; height: 100%; display: block; }
    .label {
      position: absolute;
      top: 8px; left: 10px;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
      font-weight: 600;
    }
    .controls {
      flex: 0 0 auto;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom)) 14px;
      background: var(--panel);
      border-top: 1px solid #222831;
    }
    .ctrl-row { margin-bottom: 6px; }
    .ctrl-row:last-child { margin-bottom: 0; }
    .ctrl-head {
      display: flex;
      gap: 8px;
      align-items: baseline;
      font-size: 13px;
      color: var(--muted);
    }
    .ctrl-head .val {
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      margin-left: auto;
    }
    .ctrl-head select {
      background: #0e1116;
      color: var(--text);
      border: 1px solid #2c333d;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
      font-family: inherit;
      max-width: 50%;
    }
    .ctrl-head select:focus { outline: 1px solid var(--cam); }
    .vspeed {
      color: var(--cam);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .vspeed.hidden { display: none; }
    .dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; margin-right: 6px; vertical-align: middle;
    }
    input[type="range"] {
      width: 100%;
      height: 28px;
      margin: 0;
      background: transparent;
      display: block;
    }
    input#camSlider { accent-color: var(--cam); }
    input#balSlider { accent-color: var(--bal); }
  </style>
</head>
<body>
  <div id="grid">
    <div class="cell" id="cam-1x">   <div class="label">1×</div></div>
    <div class="cell" id="cam-30x">  <div class="label">30×</div></div>
    <div class="cell" id="cam-300x"> <div class="label">300×</div></div>
    <div class="cell" id="cam-1000x"><div class="label">1000×</div></div>
  </div>
  <div id="map-wrap" class="view">
    <div class="label">Top-down</div>
    <canvas id="map"></canvas>
  </div>
  <div class="controls">
    <div class="ctrl-row">
      <div class="ctrl-head">
        <label for="camSlider"><span class="dot" style="background:var(--cam)"></span>Observer Position</label>
        <select id="vehicle" aria-label="Aircraft">
          <option value="f18">F-18 Super Hornet</option>
          <option value="fighter">Fighter jet</option>
          <option value="commercial">Commercial jet</option>
          <option value="helicopter">Helicopter</option>
          <option value="uav">UAV</option>
          <option value="biplane">Biplane</option>
          <option value="manual">Manual</option>
        </select>
        <span class="vspeed" id="vehicleSpeed">1,200 mph</span>
        <span class="val" id="camVal">−10,000 ft</span>
      </div>
      <input id="camSlider" type="range" min="-10000" max="10000" step="1" value="-10000">
    </div>
    <div class="ctrl-row">
      <div class="ctrl-head">
        <label for="object"><span class="dot" style="background:var(--bal)"></span>Object</label>
        <select id="object" aria-label="Object">
          <option value="latex">Latex balloon (1 ft)</option>
          <option value="weather">Weather balloon (5 ft)</option>
          <option value="bird">Bird (6 ft wingspan)</option>
          <option value="human">Human / skydiver (6 ft)</option>
          <option value="hotair">Hot air balloon (60 ft)</option>
          <option value="blimp">Blimp (200 ft)</option>
        </select>
      </div>
    </div>
    <div class="ctrl-row">
      <div class="ctrl-head">
        <label for="balSlider"><span class="dot" style="background:var(--bal)"></span>Balloon height</label>
        <span class="val" id="balVal">13,000 ft</span>
      </div>
      <input id="balSlider" type="range" min="500" max="13000" step="50" value="13000">
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // ---- Vehicles (cruise speeds in mph) ----
    const VEHICLES = {
      f18:        { name: 'F-18 Super Hornet', mph: 1200 },
      fighter:    { name: 'Fighter jet',       mph: 800  },
      commercial: { name: 'Commercial jet',    mph: 575  },
      helicopter: { name: 'Helicopter',        mph: 175  },
      uav:        { name: 'UAV',               mph: 135  },
      biplane:    { name: 'Biplane',           mph: 100  },
      manual:     { name: 'Manual',            mph: 0    },
    };
    let currentVehicle = 'f18';
    let flightDir = 1;          // +1 right, -1 left
    let lastFrameT = 0;

    // ---- World constants (feet) ----
    const CAMERA_Y = 25000;
    const CAMERA_PATH_HALF = 10000;
    const BALLOON_Z = 10000;             // fixed distance out from the observer's path
    const BALLOON_HEIGHT_MIN = 500;
    const BALLOON_HEIGHT_MAX = 13000;
    const BALLOON_HEIGHT_DEFAULT = 13000;
    const WIDE_FOV = 55;
    // Camera panes (clockwise from top-left: 1×, 30×, 1000×, 300×; HTML reading order
    // for the CSS grid is TL, TR, BL, BR).
    const PANES = [
      { id: 'cam-1x',    zoom: 1    },
      { id: 'cam-30x',   zoom: 30   },
      { id: 'cam-300x',  zoom: 300  },
      { id: 'cam-1000x', zoom: 1000 },
    ];

    // ---- POV (Three.js) — one renderer + camera per pane ----
    function makeRenderer(host) {
      try {
        const r = new THREE.WebGLRenderer({ antialias: true });
        r.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        host.appendChild(r.domElement);
        return r;
      } catch (e) {
        const msg = document.createElement('div');
        msg.textContent = 'WebGL not available on this device.';
        msg.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b94a3;font-size:13px;text-align:center;padding:20px';
        host.appendChild(msg);
        return null;
      }
    }
    for (const p of PANES) {
      p.host = document.getElementById(p.id);
      p.renderer = makeRenderer(p.host);
      p.camera = new THREE.PerspectiveCamera(WIDE_FOV / p.zoom, 1, 10, 250000);
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ec9f3);
    scene.fog = new THREE.Fog(0xb8d4f0, 25000, 90000);

    // Lights
    const sun = new THREE.DirectionalLight(0xfff1d6, 1.0);
    sun.position.set(-20000, 30000, -8000);
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x4a3a2a, 0.55));

    // Procedural ocean texture
    function makeOceanTexture() {
      const size = 512;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      g.fillStyle = '#1c4a74';
      g.fillRect(0, 0, size, size);
      // Wavy lighter patches
      for (let i = 0; i < 1800; i++) {
        const x = Math.random() * size, y = Math.random() * size;
        const r = 4 + Math.random() * 18;
        const sh = 30 + (Math.random() * 40) | 0;
        g.fillStyle = `rgba(${70 + sh},${120 + sh},${165 + sh},${0.10 + Math.random() * 0.22})`;
        g.beginPath();
        g.arc(x, y, r, 0, Math.PI * 2);
        g.fill();
      }
      // Whitecaps
      for (let i = 0; i < 700; i++) {
        g.fillStyle = `rgba(255,255,255,${0.35 + Math.random() * 0.55})`;
        g.beginPath();
        g.arc(Math.random() * size, Math.random() * size, 0.4 + Math.random() * 1.4, 0, Math.PI * 2);
        g.fill();
      }
      // Horizontal ripple streaks (give a sense of swell direction)
      for (let i = 0; i < 220; i++) {
        g.strokeStyle = `rgba(190,215,235,${0.08 + Math.random() * 0.15})`;
        g.lineWidth = 0.5;
        const y = Math.random() * size;
        g.beginPath();
        g.moveTo(Math.random() * size, y);
        g.lineTo(Math.random() * size + 30 + Math.random() * 60, y + (Math.random() - 0.5) * 2);
        g.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 4;
      return tex;
    }

    // ---- Perlin noise (gradient noise) for island heightfield ----
    const PERM = new Uint8Array(512);
    (() => {
      for (let i = 0; i < 256; i++) PERM[i] = i;
      let s = 1337;
      const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
      for (let i = 255; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [PERM[i], PERM[j]] = [PERM[j], PERM[i]];
      }
      for (let i = 0; i < 256; i++) PERM[i + 256] = PERM[i];
    })();
    function pFade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    function pLerp(a, b, t) { return a + (b - a) * t; }
    function pGrad2(hash, x, y) {
      const h = hash & 7;
      const u = h < 4 ? x : y;
      const v = h < 4 ? y : x;
      return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
    }
    function perlin2D(x, y) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
      x -= Math.floor(x); y -= Math.floor(y);
      const u = pFade(x), v = pFade(y);
      const A = PERM[X] + Y, B = PERM[X + 1] + Y;
      return pLerp(
        pLerp(pGrad2(PERM[A],     x,     y),     pGrad2(PERM[B],     x - 1, y),     u),
        pLerp(pGrad2(PERM[A + 1], x,     y - 1), pGrad2(PERM[B + 1], x - 1, y - 1), u),
        v
      );
    }
    function fbm(x, y) {
      let n = 0, amp = 1, freq = 1, total = 0;
      for (let i = 0; i < 4; i++) {
        n += amp * perlin2D(x * freq, y * freq);
        total += amp;
        amp *= 0.5; freq *= 2;
      }
      return n / total;
    }
    // Sparse islands: low-frequency placement * high-frequency shape detail.
    // Height capped around 25 ft so all three color bands are visible.
    const PLACEMENT_SCALE = 1 / 8000;
    const DETAIL_SCALE    = 1 / 1500;
    const PLACEMENT_CUTOFF = 0.20;
    function islandHeight(x, z) {
      const place = perlin2D(x * PLACEMENT_SCALE, z * PLACEMENT_SCALE);
      if (place <= PLACEMENT_CUTOFF) return 0;
      const shape = fbm(x * DETAIL_SCALE, z * DETAIL_SCALE);
      const peak   = (place - PLACEMENT_CUTOFF) * 50;
      const wobble = (shape + 0.4) * 8;
      return Math.max(0, peak + wobble - 4);
    }

    // Ocean — single plane that ALSO paints the islands via a shader hook.
    // Two stacked planes z-fight at long range; one mesh fixes it for good.
    function buildIslandsTexture() {
      const TEX_W = 2048, TEX_H = 1152; // ~78 ft/pixel
      const c = document.createElement('canvas');
      c.width = TEX_W; c.height = TEX_H;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(TEX_W, TEX_H);
      const d = img.data;
      for (let py = 0; py < TEX_H; py++) {
        const z = ISLE_ZMIN + (ISLE_ZMAX - ISLE_ZMIN) * py / (TEX_H - 1);
        for (let px = 0; px < TEX_W; px++) {
          const x = ISLE_XMIN + (ISLE_XMAX - ISLE_XMIN) * px / (TEX_W - 1);
          const h = islandHeight(x, z);
          const idx = (py * TEX_W + px) * 4;
          if (h <= 0) {
            d[idx + 3] = 0;
          } else if (h < 10) {
            d[idx] = 194; d[idx+1] = 168; d[idx+2] = 120; d[idx+3] = 255;
          } else if (h < 15) {
            d[idx] = 142; d[idx+1] = 138; d[idx+2] = 133; d[idx+3] = 255;
          } else {
            d[idx] = 106; d[idx+1] = 138; d[idx+2] = 78;  d[idx+3] = 255;
          }
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = 8;
      tex.magFilter = THREE.LinearFilter;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      return tex;
    }
    const ISLE_XMIN = -80000, ISLE_XMAX = 80000;
    const ISLE_ZMIN = -10000, ISLE_ZMAX = 80000;
    {
      const g = new THREE.PlaneGeometry(400000, 400000, 1, 1);
      g.rotateX(-Math.PI / 2);
      const oceanTex = makeOceanTexture();
      oceanTex.repeat.set(70, 70);
      const islandsTex = buildIslandsTexture();
      const m = new THREE.MeshLambertMaterial({ map: oceanTex, color: 0x9cb8d8 });
      m.onBeforeCompile = (shader) => {
        shader.uniforms.islandsMap   = { value: islandsTex };
        shader.uniforms.islandsMin   = { value: new THREE.Vector2(ISLE_XMIN, ISLE_ZMIN) };
        shader.uniforms.islandsSize  = { value: new THREE.Vector2(ISLE_XMAX - ISLE_XMIN, ISLE_ZMAX - ISLE_ZMIN) };
        // Vertex: forward world-space XZ position
        shader.vertexShader = 'varying vec3 vWorldPos;\n' + shader.vertexShader;
        shader.vertexShader = shader.vertexShader.replace(
          '#include <project_vertex>',
          '#include <project_vertex>\n  vWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;'
        );
        // Fragment: composite islands over ocean inside <map_fragment>
        shader.fragmentShader = (
          'uniform sampler2D islandsMap;\n' +
          'uniform vec2 islandsMin;\n' +
          'uniform vec2 islandsSize;\n' +
          'varying vec3 vWorldPos;\n'
        ) + shader.fragmentShader;
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <map_fragment>',
          [
            '#ifdef USE_MAP',
            '  vec4 sampledDiffuseColor = texture2D( map, vMapUv );',
            '  vec2 isleUV = vec2(',
            '    (vWorldPos.x - islandsMin.x) / islandsSize.x,',
            '    1.0 - (vWorldPos.z - islandsMin.y) / islandsSize.y',
            '  );',
            '  if (isleUV.x >= 0.0 && isleUV.x <= 1.0 && isleUV.y >= 0.0 && isleUV.y <= 1.0) {',
            '    vec4 islandSample = texture2D(islandsMap, isleUV);',
            '    sampledDiffuseColor.rgb = mix(sampledDiffuseColor.rgb, islandSample.rgb, islandSample.a);',
            '  }',
            '  diffuseColor *= sampledDiffuseColor;',
            '#endif',
          ].join('\n')
        );
      };
      scene.add(new THREE.Mesh(g, m));
    }

    // ---- Object builders (real-world dimensions in feet) ----
    function latheCentered(profile, segments = 24) {
      const minY = Math.min(...profile.map(p => p.y));
      const maxY = Math.max(...profile.map(p => p.y));
      const yMid = (minY + maxY) / 2;
      const pts = profile.map(p => new THREE.Vector2(p.x, p.y - yMid));
      return new THREE.LatheGeometry(pts, segments);
    }

    function buildWeatherBalloon() {
      // Standard launch size ~5 ft diameter, white latex, payload below
      const g = new THREE.Group();
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(2.5, 28, 18),
        new THREE.MeshPhongMaterial({
          color: 0xeeeef0, shininess: 80, specular: 0xaaaaaa,
          transparent: true, opacity: 0.9,
        })
      );
      sphere.scale.y = 1.1;
      g.add(sphere);
      const lineGeom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, -2.5, 0), new THREE.Vector3(0, -4.4, 0),
      ]);
      g.add(new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0x444444 })));
      const sonde = new THREE.Mesh(
        new THREE.BoxGeometry(0.55, 0.5, 0.55),
        new THREE.MeshPhongMaterial({ color: 0xff7e1a })
      );
      sonde.position.y = -4.7;
      g.add(sonde);
      return g;
    }

    function buildLatexBalloon() {
      // ~1 ft (11" standard party balloon)
      const profile = [
        new THREE.Vector2(0.00, 0.00),
        new THREE.Vector2(0.03, 0.02),
        new THREE.Vector2(0.04, 0.05),
        new THREE.Vector2(0.02, 0.07),
        new THREE.Vector2(0.07, 0.11),
        new THREE.Vector2(0.18, 0.22),
        new THREE.Vector2(0.32, 0.38),
        new THREE.Vector2(0.43, 0.57),
        new THREE.Vector2(0.49, 0.78),
        new THREE.Vector2(0.50, 0.95),
        new THREE.Vector2(0.46, 1.10),
        new THREE.Vector2(0.36, 1.22),
        new THREE.Vector2(0.18, 1.30),
        new THREE.Vector2(0.00, 1.33),
      ];
      return new THREE.Mesh(
        latheCentered(profile, 28),
        new THREE.MeshPhongMaterial({ color: 0xe23a2c, shininess: 90, specular: 0x999999 })
      );
    }

    function buildHotAirBalloon() {
      // ~50 ft envelope, ~10 ft basket below
      const g = new THREE.Group();
      const profile = [
        new THREE.Vector2(0,  -28),
        new THREE.Vector2(3,  -27),
        new THREE.Vector2(8,  -22),
        new THREE.Vector2(14, -13),
        new THREE.Vector2(20, -3),
        new THREE.Vector2(24,  8),
        new THREE.Vector2(25, 18),
        new THREE.Vector2(23, 27),
        new THREE.Vector2(17, 33),
        new THREE.Vector2(7,  35),
        new THREE.Vector2(0,  35.5),
      ];
      g.add(new THREE.Mesh(
        latheCentered(profile, 36),
        new THREE.MeshPhongMaterial({ color: 0xd13838, shininess: 30 })
      ));
      const basket = new THREE.Mesh(
        new THREE.BoxGeometry(8, 5, 8),
        new THREE.MeshLambertMaterial({ color: 0x6a4318 })
      );
      basket.position.y = -34;
      g.add(basket);
      const ropeMat = new THREE.LineBasicMaterial({ color: 0x2a1a10 });
      for (const [x, z] of [[4,4],[4,-4],[-4,4],[-4,-4]]) {
        const line = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(x, -28, z),
            new THREE.Vector3(x, -31, z),
          ]),
          ropeMat
        );
        g.add(line);
      }
      return g;
    }

    function buildHuman() {
      // Skydiver figure, ~6 ft tall, orange jumpsuit
      const g = new THREE.Group();
      const suit = new THREE.MeshPhongMaterial({ color: 0xff8a3a, shininess: 25 });
      const skin = new THREE.MeshPhongMaterial({ color: 0xe8ad88, shininess: 15 });
      const helmet = new THREE.MeshPhongMaterial({ color: 0x2c2c2c, shininess: 60 });
      // Body
      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.55, 2.0, 6, 12), suit);
      g.add(torso);
      // Head
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 18, 14), helmet);
      head.position.y = 2.0;
      g.add(head);
      // Arms (spread for skydiver pose)
      for (const side of [-1, 1]) {
        const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 1.6, 6, 8), suit);
        arm.rotation.z = side * Math.PI / 2.7;
        arm.position.set(side * 1.15, 0.6, 0);
        g.add(arm);
        // Hand
        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.18, 10, 8), skin);
        hand.position.set(side * 2.2, 0.0, 0);
        g.add(hand);
      }
      // Legs
      for (const side of [-1, 1]) {
        const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.27, 1.8, 6, 8), suit);
        leg.rotation.z = side * 0.18;
        leg.position.set(side * 0.45, -2.05, 0);
        g.add(leg);
      }
      return g;
    }

    function buildBird() {
      // Eagle-like, ~6 ft wingspan, body horizontal
      const g = new THREE.Group();
      const body = new THREE.MeshPhongMaterial({ color: 0x4d361f, shininess: 10 });
      const dark = new THREE.MeshPhongMaterial({ color: 0x2a1c10, shininess: 10 });
      const trunk = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 1.4, 6, 10), body);
      trunk.rotation.x = Math.PI / 2;
      g.add(trunk);
      // Wings — flat boxes extending sideways
      for (const side of [-1, 1]) {
        const wing = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.08, 1.0), body);
        wing.position.set(side * 1.5, 0.05, 0);
        wing.rotation.y = side * 0.18;
        g.add(wing);
        // Wing tip (darker)
        const tip = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.07, 0.7), dark);
        tip.position.set(side * 2.95, 0.05, 0.2);
        tip.rotation.y = side * 0.25;
        g.add(tip);
      }
      // Head
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 10), dark);
      head.position.set(0, 0.05, -0.95);
      g.add(head);
      // Tail
      const tail = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.06, 0.7), body);
      tail.position.set(0, 0, 0.95);
      g.add(tail);
      return g;
    }

    function buildBlimp() {
      // ~200 ft long, ~50 ft diameter cigar
      const g = new THREE.Group();
      const hullMat = new THREE.MeshPhongMaterial({ color: 0xd4d4d4, shininess: 60, specular: 0x777777 });
      const finMat = new THREE.MeshPhongMaterial({ color: 0xb0b0b0, shininess: 40 });
      const hull = new THREE.Mesh(new THREE.SphereGeometry(25, 36, 22), hullMat);
      hull.scale.x = 4; // 200 ft total length
      g.add(hull);
      // Tail fins (cross)
      const finV = new THREE.Mesh(new THREE.BoxGeometry(22, 32, 1), finMat);
      finV.position.set(-90, 0, 0);
      g.add(finV);
      const finH = new THREE.Mesh(new THREE.BoxGeometry(22, 1, 32), finMat);
      finH.position.set(-90, 0, 0);
      g.add(finH);
      // Gondola
      const gondola = new THREE.Mesh(
        new THREE.BoxGeometry(22, 6, 8),
        new THREE.MeshLambertMaterial({ color: 0x4a4a4a })
      );
      gondola.position.set(15, -23, 0);
      g.add(gondola);
      return g;
    }

    const OBJECTS = {
      latex:   { name: 'Latex balloon (1 ft)',    build: buildLatexBalloon   },
      weather: { name: 'Weather balloon (5 ft)',  build: buildWeatherBalloon },
      bird:    { name: 'Bird (6 ft wingspan)',    build: buildBird           },
      human:   { name: 'Human / skydiver (6 ft)', build: buildHuman          },
      hotair:  { name: 'Hot air balloon (60 ft)', build: buildHotAirBalloon  },
      blimp:   { name: 'Blimp (200 ft)',          build: buildBlimp          },
    };
    let currentObject = 'weather';

    const balloonGroup = new THREE.Group();
    scene.add(balloonGroup);
    function rebuildObject() {
      balloonGroup.clear();
      balloonGroup.add(OBJECTS[currentObject].build());
    }
    rebuildObject();

    function resizePane(p) {
      if (!p.renderer) return;
      const w = p.host.clientWidth, h = p.host.clientHeight;
      if (w === 0 || h === 0) return;
      p.renderer.setSize(w, h, false);
      p.camera.aspect = w / h;
      p.camera.updateProjectionMatrix();
    }
    for (const p of PANES) new ResizeObserver(() => resizePane(p)).observe(p.host);

    // ---- Top-down (2D canvas) ----
    const mapCanvas = document.getElementById('map');
    const mctx = mapCanvas.getContext('2d');
    let mapDims = { W: 0, H: 0 };

    function resizeMap() {
      const dpr = Math.min(window.devicePixelRatio, 2);
      const w = mapCanvas.clientWidth, h = mapCanvas.clientHeight;
      mapCanvas.width = Math.floor(w * dpr);
      mapCanvas.height = Math.floor(h * dpr);
      mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      mapDims = { W: w, H: h };
    }
    new ResizeObserver(() => { resizeMap(); update(); }).observe(mapCanvas);

    // ---- Controls ----
    const camSlider = document.getElementById('camSlider');
    const balSlider = document.getElementById('balSlider');
    const camVal = document.getElementById('camVal');
    const balVal = document.getElementById('balVal');

    function fmt(n) {
      const r = Math.round(n);
      const sign = r < 0 ? '−' : '';
      return sign + Math.abs(r).toLocaleString() + ' ft';
    }

    // Cached island top-down: renders the same islandHeight() field as the 3D mesh,
    // so the top-down view is unambiguously this ocean.
    const MAP_X_MIN = -16000, MAP_X_MAX = 16000;
    const MAP_Z_MIN = -2500,  MAP_Z_MAX = BALLOON_Z + 4000;
    let islandMapCanvas = null, islandMapW = 0, islandMapH = 0;
    function buildIslandMap(W, H) {
      if (islandMapCanvas && islandMapW === W && islandMapH === H) return islandMapCanvas;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(W, H);
      const d = img.data;
      for (let py = 0; py < H; py++) {
        const z = MAP_Z_MIN + (MAP_Z_MAX - MAP_Z_MIN) * py / (H - 1);
        for (let px = 0; px < W; px++) {
          const x = MAP_X_MIN + (MAP_X_MAX - MAP_X_MIN) * px / (W - 1);
          const h = islandHeight(x, z);
          const idx = (py * W + px) * 4;
          if (h <= 0) {
            d[idx + 3] = 0; // transparent — let the map background show through
          } else if (h < 10) {
            d[idx] = 194; d[idx+1] = 168; d[idx+2] = 120; d[idx+3] = 255;
          } else if (h < 15) {
            d[idx] = 142; d[idx+1] = 138; d[idx+2] = 133; d[idx+3] = 255;
          } else {
            d[idx] = 106; d[idx+1] = 138; d[idx+2] = 78;  d[idx+3] = 255;
          }
        }
      }
      ctx.putImageData(img, 0, 0);
      islandMapCanvas = c; islandMapW = W; islandMapH = H;
      return c;
    }

    function drawMap(cx) {
      const { W, H } = mapDims;
      if (W === 0 || H === 0) return;
      mctx.clearRect(0, 0, W, H);

      // World view extents
      const xMin = MAP_X_MIN, xMax = MAP_X_MAX;
      const zMin = MAP_Z_MIN, zMax = MAP_Z_MAX;
      const sx = W / (xMax - xMin);
      const sz = H / (zMax - zMin);
      const s = Math.min(sx, sz);
      const ox = (W - (xMax - xMin) * s) / 2 - xMin * s;
      const oz = (H - (zMax - zMin) * s) / 2 - zMin * s;
      const X = x => x * s + ox;
      const Z = z => z * s + oz;

      // Flat dark-blue ocean background
      mctx.fillStyle = '#0e2336';
      mctx.fillRect(0, 0, W, H);

      // Islands rendered from the same noise as the 3D mesh
      mctx.drawImage(buildIslandMap(W, H), 0, 0);

      // Observer path
      mctx.strokeStyle = '#4cb3ff';
      mctx.lineWidth = 2;
      mctx.setLineDash([6, 4]);
      mctx.beginPath();
      mctx.moveTo(X(-CAMERA_PATH_HALF), Z(0));
      mctx.lineTo(X( CAMERA_PATH_HALF), Z(0));
      mctx.stroke();
      mctx.setLineDash([]);

      // Sight line
      mctx.strokeStyle = 'rgba(255,255,255,0.6)';
      mctx.lineWidth = 1;
      mctx.beginPath();
      mctx.moveTo(X(cx), Z(0));
      mctx.lineTo(X(0), Z(BALLOON_Z));
      mctx.stroke();

      // Aircraft marker — drawn aligned with the path (facing flight direction)
      const cax = X(cx), caz = Z(0);
      mctx.save();
      mctx.translate(cax, caz);
      if (currentVehicle !== 'manual' && flightDir < 0) mctx.rotate(Math.PI);
      drawAircraft(mctx, currentVehicle);
      mctx.restore();

      // Balloon marker (height not visible from above)
      mctx.fillStyle = '#ff5a4a';
      mctx.strokeStyle = 'white';
      mctx.lineWidth = 1;
      mctx.beginPath();
      mctx.arc(X(0), Z(BALLOON_Z), 7, 0, Math.PI * 2);
      mctx.fill();
      mctx.stroke();

      // Annotation pointing at the (stationary) object
      mctx.font = '600 11px -apple-system, sans-serif';
      mctx.textAlign = 'left';
      mctx.textBaseline = 'middle';
      const annotation = "<---- Object isn't moving";
      mctx.lineWidth = 3;
      mctx.strokeStyle = 'rgba(0,0,0,0.7)';
      mctx.strokeText(annotation, X(0) + 12, Z(BALLOON_Z));
      mctx.fillStyle = 'rgba(255,255,255,0.98)';
      mctx.fillText(annotation, X(0) + 12, Z(BALLOON_Z));

      // Distance scale (Google-Maps style)
      const scaleFt = pickScaleFt(W * 0.28, s);
      const scalePx = scaleFt * s;
      const xL = 12, yB = H - 14;
      mctx.lineWidth = 2;
      mctx.strokeStyle = 'rgba(255,255,255,0.95)';
      mctx.lineCap = 'butt';
      mctx.beginPath();
      mctx.moveTo(xL, yB);                     mctx.lineTo(xL + scalePx, yB);
      mctx.moveTo(xL, yB - 5);                 mctx.lineTo(xL, yB + 5);
      mctx.moveTo(xL + scalePx, yB - 5);       mctx.lineTo(xL + scalePx, yB + 5);
      mctx.stroke();
      const label = scaleFt.toLocaleString() + ' ft';
      mctx.font = '600 11px -apple-system, sans-serif';
      mctx.textAlign = 'center';
      mctx.textBaseline = 'bottom';
      mctx.lineWidth = 3;
      mctx.strokeStyle = 'rgba(0,0,0,0.65)';
      mctx.strokeText(label, xL + scalePx / 2, yB - 7);
      mctx.fillStyle = 'rgba(255,255,255,0.98)';
      mctx.fillText(label, xL + scalePx / 2, yB - 7);
    }

    // Pick a round number whose drawn length is roughly `targetPx`.
    function pickScaleFt(targetPx, pxPerFt) {
      const targetFt = targetPx / pxPerFt;
      const options = [100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000];
      let best = options[0];
      for (const o of options) {
        if (Math.abs(Math.log(o / targetFt)) < Math.abs(Math.log(best / targetFt))) best = o;
      }
      return best;
    }

    // Aircraft icons (top-down, drawn facing +x, ~30 ft tall on screen)
    function drawAircraft(ctx, type) {
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.fillStyle = '#4cb3ff';
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 1;
      switch (type) {
        case 'fighter': {
          ctx.beginPath();
          ctx.moveTo(15, 0);
          ctx.lineTo(4, -2.5);
          ctx.lineTo(-3, -11);
          ctx.lineTo(-10, -10);
          ctx.lineTo(-10, -2.5);
          ctx.lineTo(-13, -5);
          ctx.lineTo(-13, 5);
          ctx.lineTo(-10, 2.5);
          ctx.lineTo(-10, 10);
          ctx.lineTo(-3, 11);
          ctx.lineTo(4, 2.5);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          break;
        }
        case 'commercial': {
          // Fuselage
          ctx.beginPath();
          ctx.moveTo(17, 0);
          ctx.lineTo(13, -2.5);
          ctx.lineTo(-15, -2);
          ctx.lineTo(-17, 0);
          ctx.lineTo(-15, 2);
          ctx.lineTo(13, 2.5);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Main wings (swept)
          ctx.beginPath();
          ctx.moveTo(4, -2);
          ctx.lineTo(-2, -13);
          ctx.lineTo(-6, -13);
          ctx.lineTo(-4, -2);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(4, 2);
          ctx.lineTo(-2, 13);
          ctx.lineTo(-6, 13);
          ctx.lineTo(-4, 2);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Tail wings
          ctx.beginPath();
          ctx.moveTo(-12, -1.5);
          ctx.lineTo(-14, -6);
          ctx.lineTo(-16, -6);
          ctx.lineTo(-14, -1.5);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-12, 1.5);
          ctx.lineTo(-14, 6);
          ctx.lineTo(-16, 6);
          ctx.lineTo(-14, 1.5);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          break;
        }
        case 'helicopter': {
          // Tail boom
          ctx.beginPath();
          ctx.moveTo(-2, -1.2);
          ctx.lineTo(-14, -1);
          ctx.lineTo(-14, 1);
          ctx.lineTo(-2, 1.2);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Tail rotor
          ctx.beginPath();
          ctx.ellipse(-14, 0, 1.5, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          // Body
          ctx.beginPath();
          ctx.ellipse(2, 0, 8, 5, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
          // Main rotor disc
          ctx.strokeStyle = 'rgba(76,179,255,0.55)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(2, 0, 13, 0, Math.PI * 2);
          ctx.stroke();
          break;
        }
        case 'uav': {
          // Quadcopter arms
          ctx.strokeStyle = '#4cb3ff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-8, -8); ctx.lineTo(8, 8);
          ctx.moveTo(-8, 8); ctx.lineTo(8, -8);
          ctx.stroke();
          // Hub
          ctx.fillStyle = '#4cb3ff';
          ctx.beginPath();
          ctx.arc(0, 0, 3, 0, Math.PI * 2);
          ctx.fill();
          // Rotor discs
          ctx.fillStyle = 'rgba(76,179,255,0.25)';
          ctx.strokeStyle = 'rgba(180,220,255,0.8)';
          ctx.lineWidth = 1;
          for (const [px, py] of [[-9,-9],[9,9],[-9,9],[9,-9]]) {
            ctx.beginPath();
            ctx.arc(px, py, 4, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
          }
          break;
        }
        case 'biplane': {
          // Fuselage
          ctx.beginPath();
          ctx.moveTo(11, 0);
          ctx.lineTo(7, -1.5);
          ctx.lineTo(-10, -1.5);
          ctx.lineTo(-10, 1.5);
          ctx.lineTo(7, 1.5);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Upper wing
          ctx.fillRect(-3, -11, 6, 22);
          ctx.strokeRect(-3, -11, 6, 22);
          // Lower wing hint (offset thin line) — gives biplane feel
          ctx.strokeStyle = 'rgba(255,255,255,0.65)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-1, -11); ctx.lineTo(-1, 11);
          ctx.moveTo(1, -11);  ctx.lineTo(1, 11);
          ctx.stroke();
          // Tail
          ctx.fillStyle = '#4cb3ff';
          ctx.strokeStyle = 'white';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-9, -4); ctx.lineTo(-12, -4);
          ctx.lineTo(-12, 4); ctx.lineTo(-9, 4);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          break;
        }
        default: { // manual
          ctx.beginPath();
          ctx.moveTo(13, 0);
          ctx.lineTo(-8, -8);
          ctx.lineTo(-8,  8);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
        }
      }
    }

    function update() {
      const cx = parseFloat(camSlider.value);
      const bh = parseFloat(balSlider.value); // balloon height (Y)
      balloonGroup.position.set(0, bh, BALLOON_Z);
      for (const p of PANES) {
        p.camera.position.set(cx, CAMERA_Y, 0);
        p.camera.lookAt(0, bh, BALLOON_Z);
      }
      camVal.textContent = fmt(cx);
      balVal.textContent = fmt(bh);
      drawMap(cx);
    }

    const vehicleSelect = document.getElementById('vehicle');
    const speedEl = document.getElementById('vehicleSpeed');
    function setVehicle(v) {
      if (!VEHICLES[v]) v = 'manual';
      currentVehicle = v;
      if (vehicleSelect.value !== v) vehicleSelect.value = v;
      if (v === 'manual') {
        speedEl.classList.add('hidden');
      } else {
        speedEl.textContent = VEHICLES[v].mph.toLocaleString() + ' mph';
        speedEl.classList.remove('hidden');
      }
      lastFrameT = 0; // restart dt accumulation
    }

    const objectSelect = document.getElementById('object');

    // Optional query-string initial values: ?cam=10000&bal=12000&vehicle=helicopter&obj=blimp
    {
      const q = new URLSearchParams(location.search);
      const c = parseFloat(q.get('cam'));
      const b = parseFloat(q.get('bal'));
      if (Number.isFinite(c)) {
        camSlider.value = Math.max(-CAMERA_PATH_HALF, Math.min(CAMERA_PATH_HALF, c));
        currentVehicle = 'manual';
      }
      if (Number.isFinite(b)) balSlider.value = Math.max(BALLOON_HEIGHT_MIN, Math.min(BALLOON_HEIGHT_MAX, b));
      const qv = q.get('vehicle');
      if (qv && VEHICLES[qv]) currentVehicle = qv;
      const qo = q.get('obj');
      if (qo && OBJECTS[qo]) {
        currentObject = qo;
        rebuildObject();
      }
      objectSelect.value = currentObject;
    }
    setVehicle(currentVehicle);

    camSlider.addEventListener('input', () => {
      // Touching the observer slider switches to manual.
      if (currentVehicle !== 'manual') setVehicle('manual');
      update();
    });
    balSlider.addEventListener('input', update);
    vehicleSelect.addEventListener('change', () => setVehicle(vehicleSelect.value));
    objectSelect.addEventListener('change', () => {
      currentObject = objectSelect.value;
      rebuildObject();
      update();
    });

    function tick(t) {
      // Animate observer position when a vehicle is flying.
      if (currentVehicle !== 'manual') {
        if (lastFrameT > 0) {
          const dt = Math.min(0.1, (t - lastFrameT) / 1000);
          const ftPerSec = VEHICLES[currentVehicle].mph * 5280 / 3600;
          let pos = parseFloat(camSlider.value) + flightDir * ftPerSec * dt;
          if (pos >= CAMERA_PATH_HALF) { pos = CAMERA_PATH_HALF; flightDir = -1; }
          else if (pos <= -CAMERA_PATH_HALF) { pos = -CAMERA_PATH_HALF; flightDir = 1; }
          camSlider.value = pos;
          update();
        }
        lastFrameT = t;
      }
      for (const p of PANES) if (p.renderer) p.renderer.render(scene, p.camera);
      requestAnimationFrame(tick);
    }

    for (const p of PANES) resizePane(p);
    resizeMap();
    update();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
